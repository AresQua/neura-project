<!DOCTYPE html>
<html>
<head>
    <title>Neura</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance App">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-yellow: #ffee00;
            --bright-yellow: #fff200;
            --neru-black: #1a1a1a;
            --bg-dark: #121212;
            --baground-dark: #252525;
            --text-light: #ffffff;
            --in-color: #2ecc71;
            --out-color: #e74c3c;
            --btn-gray: #333333;
            --border-line: #444;
            --bg-items: #333;
        }

        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden; 
            overscroll-behavior-y: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-light); 
        }

        h1, .nav-item, label, #displaySaldo {
            font-weight: 900 !important;
        }

        .header-container { 
            width: 100%; padding: 40px 0; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; position: relative; 
            overflow: hidden; min-height: 120px; 
        }
        
        .header-container::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 200%; height: 100%; 
            background: linear-gradient(to right, #ffee00, #ffcc00, #ffee00); 
            background-size: 200% 100%; animation: gradientMove 8s linear infinite; z-index: -1; 
        }
        
        @keyframes gradientMove { 0% { background-position: 0% 0%; } 100% { background-position: -200% 0%; } }

        .header-content { text-align: center; z-index: 2; }
        .header-content h1 { 
            color: black; font-size: 1.8em; margin: 0; 
            letter-spacing: 2px; font-weight: 900;
        }

        #displaySaldo {
            display: inline-block; margin-top: 10px; color: black; font-weight: 900; 
            font-size: 1.1em; background: rgba(255,255,255,0.3); 
            padding: 5px 15px; border-radius: 20px;
        }

        .category-nav {
            display: flex; background: var(--neru-black); position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--bg-items);
        }
        .nav-item {
            flex: 1; padding: 18px 10px; text-align: center; font-weight: 900; cursor: pointer;
            transition: 0.3s; color: #666; font-size: 0.85em; letter-spacing: 1px;
            text-transform: uppercase; -webkit-tap-highlight-color: transparent;
        }
        .nav-item.active { color: var(--primary-yellow); border-bottom: 4px solid var(--primary-yellow); }

        .view-slider {
            display: flex; width: 200%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: pan-y;
        }
        .view-page { width: 50%; box-sizing: border-box; }

        .main-card {
            background: var(--neru-black); margin: 20px 15px 30px 15px;
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative; z-index: 10; border-top: 5px solid var(--primary-yellow);
        }

        .main-card-2 {
            background: var(--neru-black); margin: 20px 15px 30px 15px;
            padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative; z-index: 10;
        }

        .type-selector { 
            display: flex; background: var(--btn-gray); 
            padding: 5px; border-radius: 15px; margin-bottom: 25px; position: relative;
            overflow: hidden;
        }
        
        .type-btn {
            flex: 1; padding: 14px; text-align: center; border-radius: 12px;
            cursor: pointer; font-family: 'Inter', sans-serif;
            font-weight: 900 !important; font-size: 0.85em; z-index: 2;
            transition: color 0.3s ease; color: #aaa;
            -webkit-tap-highlight-color: transparent;
        }

        .type-btn.active { color: white; }
        
        .selection-indicator {
            position: absolute; width: calc(50% - 5px); height: calc(100% - 10px);
            top: 5px; border-radius: 10px; z-index: 1; display: none;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
        }

        .active-in .selection-indicator { display: block; transform: translateX(0); background: var(--in-color); }
        .active-out .selection-indicator { display: block; transform: translateX(100%); background: var(--out-color); }

        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: var(--primary-yellow); font-size: 0.8em; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        
        input, textarea {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--bg-items);
            background: var(--baground-dark); color: white; box-sizing: border-box; font-size: 16px;
            font-family: 'Inter', sans-serif; font-weight: 700;
        }

        input:focus, textarea:focus { outline: none; border-color: var(--primary-yellow); }

        .submit-btn {
            width: 100%; padding: 18px; background: var(--primary-yellow);
            color: black; border: none; border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 900 !important; font-size: 1.1em; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            margin-top: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #b3a700;
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b3a700; }

        .submit-btn-2 {
            width: 60%; display: block; margin: 18px auto 0 auto; padding: 10px; background: var(--primary-yellow);
            color: black; border: none; border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 900 !important; font-size: 0.9em; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            margin-top: 30px; margin-bottom: 10px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #b3a700;
            -webkit-appearance: none;
            appearance: none;
            -webkit-tap-highlight-color: transparent;
        }

        .submit-btn-2:active { transform: translateY(2px); box-shadow: 0 2px 0 #b3a700; }

        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--bg-items); color: #ccc;
        }
        .history-item:hover { background: var(--bg-items); color: var(--primary-yellow); }
        .delete-history { color: #e74c3c; padding: 5px 10px; font-weight: 900; font-size: 18px; }

        .empty-state { text-align: center; padding: 50px 20px; color: #555; }
        .empty-state i { font-size: 4em; margin-bottom: 15px; }

        .triangle-container { 
            position: absolute; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); 
            opacity: 0.8; z-index: 0; pointer-events: none; 
        }

        @keyframes triangleMove { 
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 0; } 
            50% { transform: translate(50px, -50px) scale(1) rotate(180deg); opacity: 0.6; } 
            100% { transform: translate(100px, 100px) scale(0.5) rotate(360deg); opacity: 0; } 
        }

        .click-particle { 
            position: absolute; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); 
            z-index: 9999; pointer-events: none; 
        }

        .tabel {
            width: 97%;
            margin: 20px 15px 30px 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            border-collapse: collapse;
            font-size: 0.75em;
            color: white;
            min-width: 600px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;

            margin: 15px 0 30px 0;
        }

        .pagination button {
            background: var(--btn-gray);
            border: none;
            color: white;

            width: 40px;
            height: 40px;

            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;

            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .pagination button:hover {
            background: var(--primary-yellow);
            color: black;
        }

        #pageInfo {
            font-size: 0.85em;
            font-weight: 700;
            color: #aaa;
        }
        
        .toast {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            
            background: var(--neru-black);
            color: var(--primary-yellow);
            
            padding: 14px 20px;
            border-radius: 12px;
            
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 1px;
            
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--bg-items);
            
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .summary-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .summary-card {
            background: var(--baground-dark);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--bg-items);
        }

        .summary-title {
            font-size: 0.7em;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #888;
        }

        .summary-value {
            font-size: 0.9em;
            font-weight: 900;
        }

        .summary-card.pemasukan .summary-value {
            color: var(--in-color);
        }

        .summary-card.pengeluaran .summary-value {
            color: var(--out-color);
        }

        .summary-card.selisih.positive .summary-value {
            color: var(--in-color);
        }

        .summary-card.selisih.negative .summary-value {
            color: var(--out-color);
        }

        .summary-card.selisih.zero .summary-value {
            color: #aaa;
        }

        .custom-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 10000;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s ease;
        }
        .custom-alert-box {
            background: var(--neru-black); border: 2px solid var(--bg-items);
            border-radius: 15px; padding: 25px; width: 80%; max-width: 320px;
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-alert-box h3 { color: var(--out-color); margin-top: 0; font-weight: 900; }
        .custom-alert-box p { font-size: 0.9em; color: #ccc; margin-bottom: 20px; }
        .alert-btn-group { display: flex; justify-content: center; gap: 10px; }

        .jenis-dropdown-panel {
            display: none;
            position: absolute;
            top: 100%; left: 0;
            background: var(--baground-dark);
            border: 1px solid var(--border-line);
            border-radius: 8px;
            padding: 8px;
            z-index: 200;
            min-width: 140px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }
        .jenis-dropdown-panel.open { display: block; }
        .jenis-dropdown-panel label {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 400; text-transform: none;
            color: white; padding: 4px 0; cursor: pointer;
            text-align: left; justify-content: flex-start; width: 100%;
        }

        .jenis-dropdown-panel label input[type="checkbox"] {
            flex-shrink: 0;
            width: 10%;
        }
        .jenis-dropdown-panel label span {
            flex: 1;
            text-align: left;
        }

        .picker-field{ position:relative; }
        .picker-trigger{
            width:100%; background:var(--bg-items); color:var(--text-light);
            font-size:9px; border:1px solid #555; padding:5px; border-radius:6px;
            cursor:pointer; text-align:left; -webkit-tap-highlight-color: transparent;
        }
        .picker-trigger:hover{ border-color:var(--primary-yellow); }
        .picker-panel{
            position:absolute; top:calc(100% + 4px); left:0;
            background:var(--baground-dark); border:1px solid var(--border-line);
            border-radius:12px; padding:14px; z-index:200; width:220px;
            box-shadow:0 6px 16px rgba(0,0,0,0.5);
            opacity:0; pointer-events:none;
            transform:translateY(-6px) scale(0.96); transform-origin:top left;
            transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34,1.2,0.64,1);
            -webkit-tap-highlight-color: transparent;
        }
        .picker-panel.open{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }

        .picker-actions button.picker-clear{
            color: var(--out-color);
            margin-right: auto;
            -webkit-tap-highlight-color: transparent; /* biar Hapus nempel kiri, Batal/OK tetep ngumpul kanan */
        }
        .picker-trigger.picker-trigger-lg{
            font-size: 16px;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid var(--bg-items);
            -webkit-tap-highlight-color: transparent;
        }

        .cal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; -webkit-tap-highlight-color: transparent; }
        .cal-title{ font-weight:900; font-size:0.8em; color:var(--text-light); -webkit-tap-highlight-color: transparent; }
        .cal-nav{ background:var(--btn-gray); border:none; color:var(--text-light); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:0.8em; transition:0.15s; -webkit-tap-highlight-color: transparent; }
        .cal-nav:hover{ background:var(--primary-yellow); color:black; transform:scale(1.1); -webkit-tap-highlight-color: transparent; }
        .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; transition:opacity 0.12s ease; -webkit-tap-highlight-color: transparent; }
        .cal-dow{ font-size:0.55em; color:#888; font-weight:700; padding-bottom:4px; -webkit-tap-highlight-color: transparent; }
        .cal-day{
            aspect-ratio:1; display:flex; align-items:center; justify-content:center;
            border-radius:50%; cursor:pointer; font-size:0.68em; color:var(--text-light);
            transition: background 0.15s ease, color 0.15s ease; -webkit-tap-highlight-color: transparent;
        }
        .cal-day:hover{ background:#333; }
        .cal-day.today{ color:var(--primary-yellow); font-weight:900; -webkit-tap-highlight-color: transparent; }
        .cal-day.selected{ background:var(--primary-yellow); color:black; font-weight:900; animation: dayPop 0.25s ease; -webkit-tap-highlight-color: transparent; }
        .cal-day.empty{ visibility:hidden; cursor:default; -webkit-tap-highlight-color: transparent; }
        @keyframes dayPop{ 0%{transform:scale(0.6);} 65%{transform:scale(1.15);} 100%{transform:scale(1);} }

        .time-display{ display:flex; justify-content:center; align-items:center; gap:2px; margin-bottom:14px; -webkit-tap-highlight-color: transparent; }
        .time-num{ font-size:1.5em; font-weight:900; color:#555; cursor:pointer; padding:2px 6px; border-radius:6px; transition: background 0.15s ease, color 0.15s ease; -webkit-tap-highlight-color: transparent; }
        .time-num.active{ color:var(--primary-yellow); background:#1a1a1a; -webkit-tap-highlight-color: transparent; }
        .time-colon{ font-size:1.5em; font-weight:900; color:#555; -webkit-tap-highlight-color: transparent; }

        .clock-face{ position:relative; width:190px; height:190px; border-radius:50%; background:#1a1a1a; margin:0 auto; user-select:none; touch-action:none; -webkit-tap-highlight-color: transparent; }
        .clock-center{ position:absolute; top:50%; left:50%; width:6px; height:6px; background:var(--primary-yellow); border-radius:50%; transform:translate(-50%,-50%); z-index:5; -webkit-tap-highlight-color: transparent; }
        .clock-hand{
            position:absolute; bottom:50%; left:50%; width:2px; background:var(--primary-yellow);
            transform-origin:bottom center; z-index:3; pointer-events:none;
            transition: height 0.2s cubic-bezier(0.34,1.2,0.64,1), transform 0.2s cubic-bezier(0.34,1.2,0.64,1);
            -webkit-tap-highlight-color: transparent;
        }
        .clock-hand-end{ position:absolute; width:28px; height:28px; background:var(--primary-yellow); border-radius:50%; top:-14px; left:50%; transform:translateX(-50%); -webkit-tap-highlight-color: transparent; }
        .clock-num{
            position:absolute; display:flex; align-items:center; justify-content:center;
            font-weight:700; color:var(--text-light); border-radius:50%; cursor:pointer;
            transform:translate(-50%,-50%); z-index:4;
            animation: numPop 0.18s ease;
            transition: background 0.15s ease, color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .clock-num.outer{ width:26px; height:26px; font-size:0.68em; -webkit-tap-highlight-color: transparent; }
        .clock-num.inner{ width:22px; height:22px; font-size:0.52em; color:#888; -webkit-tap-highlight-color: transparent; }
        .clock-num.selected{ color:black; font-weight:900; background:var(--primary-yellow); -webkit-tap-highlight-color: transparent; }
        @keyframes numPop{ from{opacity:0; transform:translate(-50%,-50%) scale(0.4);} to{opacity:1; transform:translate(-50%,-50%) scale(1);} }

        .picker-actions{ display:flex; justify-content:flex-end; gap:2px; margin-top:12px; -webkit-tap-highlight-color: transparent; }
        .picker-actions button{ background:none; border:none; color:var(--primary-yellow); font-weight:900; font-size:0.65em; text-transform:uppercase; letter-spacing:0.5px; padding:6px 10px; border-radius:6px; cursor:pointer; transition:background 0.15s ease; -webkit-tap-highlight-color: transparent; }
        .picker-actions button:hover{ background:#333; }

        /* buat select all / unselect all di filter Jenis */
        .jenis-bulk-actions{ display:flex; gap:6px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border-line); -webkit-tap-highlight-color: transparent; }
        .jenis-bulk-actions button{ flex:1; background:var(--btn-gray); border:none; color:var(--primary-yellow); font-size:10px; font-weight:900; padding:5px; border-radius:6px; cursor:pointer; -webkit-tap-highlight-color: transparent; }
        .jenis-bulk-actions button:hover{ background:var(--primary-yellow); color:black; -webkit-tap-highlight-color: transparent; }

        @media screen and (max-width: 480px) {
            th, td {
                padding: 6px 4px !important; /* Padding lebih rapat */
                font-size: 10px; /* Font lebih kecil sedikit */
            }
            
            .header-container {
                padding: 40px 0; /* Header lebih pendek di mobile */
            }

            .header-content h1 {
                font-size: 1.2rem;
            }

            .tabel {
                min-width: 400px;
                width: 93%;
            }

            .summary-box {
                grid-template-columns: 1fr;
            }

            .picker-field[data-field="jam"] .picker-panel,
            .picker-field[data-field="chartEnd"] .picker-panel{
                left: auto;
                right: 0;
                transform-origin: top right;
            }
        }
    </style>
</head>
<body>

<header class="header-container" id="header">
    <div class="header-content">
        <h1>MY FINANCIAL REPORT</h1>
        <div id="displaySaldo">Loading Saldo...</div>
    </div>
</header>

<nav class="category-nav">
    <div class="nav-item active" id="tabKirim" onclick="switchPage(0)">KIRIM LAPORAN</div>
    <div class="nav-item" id="tabLihat" onclick="switchPage(1)">LIHAT CATATAN</div>
</nav>

<div class="view-slider" id="mainSlider">
    
    <div class="view-page" id="pageKirim">
        <div class="main-card">
            <div class="type-selector" id="typeSelector">
                <div class="selection-indicator" id="indicator"></div>
                <div class="type-btn" id="btnIn" onclick="setType('pemasukan')">PEMASUKAN</div>
                <div class="type-btn" id="btnOut" onclick="setType('pengeluaran')">PENGELUARAN</div>
            </div>

            <div style="display: flex; gap: 12px;">
                <div class="input-group" style="flex: 1;">
                    <label>Tanggal</label>
                    <div class="picker-field" data-field="tgl" data-type="date" data-placeholder="dd/mm/yyyy">
                        <button type="button" class="picker-trigger picker-trigger-lg" onclick="togglePicker(this, event)"><span class="picker-label">dd/mm/yyyy</span></button>
                        <div class="picker-panel">
                            <div class="cal-header">
                                <button type="button" class="cal-nav" onclick="changeMonth(this, -1)">‹</button>
                                <div class="cal-title"></div>
                                <button type="button" class="cal-nav" onclick="changeMonth(this, 1)">›</button>
                            </div>
                            <div class="cal-grid"></div>
                            <div class="picker-actions">
                                <button type="button" class="picker-clear" onclick="clearPicker(this)">Hapus</button>
                                <button type="button" onclick="cancelPicker(this)">Batal</button>
                                <button type="button" onclick="confirmDatePicker(this)">OK</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Waktu</label>
                    <div class="picker-field" data-field="jam" data-type="time" data-placeholder="--:--">
                        <button type="button" class="picker-trigger picker-trigger-lg" onclick="togglePicker(this, event)"><span class="picker-label">--:--</span></button>
                        <div class="picker-panel">
                            <div class="time-display">
                                <span class="time-num hour-num" onclick="setTimeMode(this,'hour')"></span><span class="time-colon">:</span><span class="time-num min-num" onclick="setTimeMode(this,'minute')"></span>
                            </div>
                            <div class="clock-face" onclick="clockClick(this, event)">
                                <div class="clock-center"></div>
                                <div class="clock-hand"><div class="clock-hand-end"></div></div>
                            </div>
                            <div class="picker-actions">
                                <button type="button" class="picker-clear" onclick="clearPicker(this)">Hapus</button>
                                <button type="button" onclick="cancelPicker(this)">Batal</button>
                                <button type="button" onclick="confirmTimePicker(this)">OK</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-group" style="position: relative;">
                <label>Jenis Laporan</label>

<script>
    let selectedType = '';
    let currentPage = 0;
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHJyLvbjdM3XP8Fkknldd0G62ph-Gb9ofxhzZI8nL2AEGb-gaOHK4UZoTryV9WmpyF/exec"; 
    const colorPalette = ["#ffee00", "#ffffff", "#ffcc00", "#e0e0e0"];
    const header = document.getElementById('header');

    let isSelectMode = false;
    let selectedRows = [];

    let touchstartX = 0;
    let touchendX = 0;

    function switchPage(index) {
        currentPage = index;
        const slider = document.getElementById('mainSlider');
        const tabKirim = document.getElementById('tabKirim');
        const tabLihat = document.getElementById('tabLihat');

        if (index === 0) {
            slider.style.transform = 'translateX(0%)';
            tabKirim.classList.add('active');
            tabLihat.classList.remove('active');
        } else {
            slider.style.transform = 'translateX(-50%)';
            tabLihat.classList.add('active');
            tabKirim.classList.remove('active');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('nominal').addEventListener('input', function(e) {
        let value = this.value.replace(/\D/g, "");
        if (value) { this.value = parseInt(value).toLocaleString('id-ID'); }
    });

    async function updateSaldoHeader() {
        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            document.getElementById('displaySaldo').innerText = "Saldo: " + data.formattedSaldo;
        } catch (e) {
            document.getElementById('displaySaldo').innerText = "Saldo: Rp 0";
        }
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem('jenisHistory') || "[]");
        const dropdown = document.getElementById('custom-history-dropdown');
        if (history.length === 0) { dropdown.style.display = 'none'; return; }
        dropdown.innerHTML = history.map((item, index) => `
            <div class="history-item">
                <span onclick="selectHistory('${item}')" style="font-weight:700">${item}</span>
                <div class="delete-history" onclick="deleteHistoryItem(event, ${index})">&times;</div>
            </div>
        `).join('');
        dropdown.style.display = 'block';
    }

    function selectHistory(val) {
        document.getElementById('jenis').value = val;
        document.getElementById('custom-history-dropdown').style.display = 'none';
    }

    function deleteHistoryItem(event, index) {
        event.stopPropagation();
        let history = JSON.parse(localStorage.getItem('jenisHistory') || "[]");
        history.splice(index, 1);
        localStorage.setItem('jenisHistory', JSON.stringify(history));
        showHistory();
    }

    function filterHistory() {
        const val = document.getElementById('jenis').value.toLowerCase();
        const items = document.querySelectorAll('.history-item');
        let hasVisible = false;
        items.forEach(item => {
            const text = item.querySelector('span').innerText.toLowerCase();
            if (text.includes(val)) { item.style.display = 'flex'; hasVisible = true; }
            else { item.style.display = 'none'; }
        });
        document.getElementById('custom-history-dropdown').style.display = hasVisible ? 'block' : 'none';
    }

    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('custom-history-dropdown');
        const input = document.getElementById('jenis');
        if (e.target !== input && !dropdown.contains(e.target)) { dropdown.style.display = 'none'; }
    });

    window.onload = () => {
        const now = new Date();

        ensurePickerData('tgl', 'date');
        pickerData['tgl'].confirmedDate = now;
        document.querySelector('.picker-field[data-field="tgl"] .picker-label').innerText =
            `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

        ensurePickerData('jam', 'time');
        pickerData['jam'].confirmedHour = now.getHours();
        pickerData['jam'].confirmedMinute = now.getMinutes();
        document.querySelector('.picker-field[data-field="jam"] .picker-label').innerText =
            `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

        for (let i = 0; i < 20; i++) createRandomTriangle();
        updateSaldoHeader();
    };

    function setType(t) {
        const container = document.getElementById('typeSelector');
        const indicator = document.getElementById('indicator');
        const bIn = document.getElementById('btnIn');
        const bOut = document.getElementById('btnOut');
        indicator.style.transition = selectedType === '' ? 'none' : 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease';
        selectedType = t;
        if(t === 'pemasukan') { container.className = 'type-selector active-in'; bIn.classList.add('active'); bOut.classList.remove('active'); }
        else { container.className = 'type-selector active-out'; bOut.classList.add('active'); bIn.classList.remove('active'); }
    }

    function resetForm() {
        document.getElementById('nominal').value = '';
        document.getElementById('keterangan').value = '';
        document.getElementById('jenis').value = '';
        selectedType = '';
        document.getElementById('typeSelector').className = 'type-selector';
        document.getElementById('btnIn').classList.remove('active');
        document.getElementById('btnOut').classList.remove('active');
    }

    async function kirimData() {
        const nominalStr = document.getElementById('nominal').value.replace(/\./g, "");
        const jenis = document.getElementById('jenis').value;
        const tanggalVal = getPickerDateValue('tgl');
        const waktuVal = getPickerTimeValue('jam');

        if(!selectedType || !nominalStr || !jenis || !tanggalVal || !waktuVal) {
            showToast("Harap Lengkapi Data!");
            return;
        }

        const btn = document.getElementById('btnSimpan');
        const originalText = btn.innerText;
        btn.innerText = "MENGIRIM...";
        btn.disabled = true;

        const formData = new URLSearchParams();
        formData.append('tanggal', tanggalVal);
        formData.append('waktu', waktuVal);
        formData.append('jenis', jenis);
        formData.append('keterangan', document.getElementById('keterangan').value);
        formData.append('nominal', nominalStr);
        formData.append('tipe', selectedType);

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });

        showToast("Data Terkirim!");
        let history = JSON.parse(localStorage.getItem('jenisHistory') || "[]");
        if (jenis && !history.includes(jenis)) {
            history.push(jenis);
            localStorage.setItem('jenisHistory', JSON.stringify(history));
        }
        resetForm();

        setTimeout(async () => {
            await updateSaldoHeader(); 
            btn.innerText = originalText;
            btn.disabled = false;
        }, 3000); 
    }

    async function mintaLaporan() {
        const btn = document.getElementById('btnLaporan');
        if (!btn) return;

        const originalText = btn.innerText;
        btn.innerText = "MENGANALISIS...";
        btn.disabled = true;

        try {
            const url = new URL(WEB_APP_URL);
            url.searchParams.append("action", "minta_laporan");

            await fetch(url.toString());

            if (typeof showToast === "function") {
            showToast("Laporan sedang dikirim ke email kamu!");
            } else {
            alert("Laporan sedang dikirim ke email kamu!");
            }
        } catch (err) {
            if (typeof showToast === "function") {
            showToast("Gagal meminta laporan.");
            } else {
            alert("Gagal meminta laporan.");
            }
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    function createRandomTriangle() {
        const triangle = document.createElement('div');
        triangle.classList.add('triangle-container');
        const size = Math.random() * 20 + 10;
        triangle.style.width = `${size}px`; triangle.style.height = `${size}px`;
        triangle.style.left = `${Math.random() * header.offsetWidth}px`;
        triangle.style.top = `${Math.random() * header.offsetHeight}px`;
        triangle.style.background = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        triangle.style.animation = `triangleMove ${Math.random() * 10 + 5}s ease-in-out infinite`;
        header.appendChild(triangle);
    }

    document.addEventListener('click', (e) => {
        for (let i = 0; i < 5; i++) {
            const p = document.createElement('div');
            p.classList.add('click-particle');
            const size = Math.random() * 15 + 5;
            p.style.width = `${size}px`; p.style.height = `${size}px`;
            p.style.background = colorPalette[Math.floor(Math.random() * colorPalette.length)];
            p.style.left = `${e.pageX}px`; p.style.top = `${e.pageY}px`;
            document.body.appendChild(p);
            p.animate([{ transform: `translate(0, 0) scale(1) rotate(0deg)`, opacity: 1 }, { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px) scale(0) rotate(360deg)`, opacity: 0 }], { duration: 500 });
            setTimeout(() => p.remove(), 500);
        }
    });

    let myChart;

    function initChart(data) {
        const ctx = document.getElementById('financeChart').getContext('2d');
        
        // Gradient untuk area bawah garis ala saham
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(255, 238, 0, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 238, 0, 0)');

        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(r => r.tgl),
                datasets: [{
                    label: 'Saldo',
                    data: data.map(r => r.saldo),
                    borderColor: '#ffee00',
                    borderWidth: 3,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4, // Membuat garis melengkung (smooth)
                    pointRadius: 2,
                    pointBackgroundColor: '#ffee00'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,

                interaction: {
                    mode: 'index',
                    intersect: false,
                },

                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#666', font: { size: 10 } } },
                    y: { grid: { color: 'var(--bg-items)' }, ticks: { color: '#666', font: { size: 10 } } }
                }
            }
        });
    }

    function updateChartPeriod(period, element) {
        // Atur tombol aktif
        document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
        if (element) element.classList.add('active');

        // Show/Hide box custom
        const customBox = document.getElementById('customPeriodBox');
        customBox.style.display = (period === 'CUSTOM') ? 'flex' : 'none';

        const now = new Date();
        let startDate = new Date();
        let endDate = new Date();

        if (period === '1D') {
            startDate.setHours(0, 0, 0, 0);
        } else if (period === '1W') {
            startDate.setDate(now.getDate() - 7);
        } else if (period === '1M') {
            startDate.setMonth(now.getMonth() - 1);
        } else if (period === '3M') {
            startDate.setMonth(now.getMonth() - 3); // LOGIKA 3 BULAN
        } else if (period === '1Y') {
            startDate.setFullYear(now.getFullYear() - 1);
        } else if (period === 'CUSTOM') {
            const sVal = getPickerDateValue('chartStart');
            const eVal = getPickerDateValue('chartEnd');
            if (!sVal || !eVal) return; // Tunggu sampai kedua tanggal diisi
            startDate = new Date(sVal);
            endDate = new Date(eVal);
            endDate.setHours(23, 59, 59);
        }

        // Filter data (Gunakan urutan asli spreadsheet agar alur saldo di grafik benar)
        const filtered = fullData.filter(r => {
            const d = new Date(r[0]);
            return d >= startDate && d <= endDate;
        });

        const chartData = filtered.map(r => ({
            tgl: r[0].split('-').slice(1).reverse().join('/'),
            saldo: parseFloat(r[6].replace(/\./g, '')) || 0
        }));

        if (chartData.length > 0) initChart(chartData);
    }

    function updateChartPeriodCustom(){ updateChartPeriod('CUSTOM'); }

    function updateSummary(data) {

        let totalMasuk = 0;
        let totalKeluar = 0;

        data.forEach(r => {

            const masuk = parseFloat(r[4].replace(/\./g, '')) || 0;
            const keluar = parseFloat(r[5].replace(/\./g, '')) || 0;

            totalMasuk += masuk;
            totalKeluar += keluar;
        });

        const selisih = totalMasuk - totalKeluar;

        document.getElementById('sumMasuk').innerText =
            'Rp ' + totalMasuk.toLocaleString('id-ID');

        document.getElementById('sumKeluar').innerText =
            'Rp ' + totalKeluar.toLocaleString('id-ID');

        document.getElementById('sumSelisih').innerText =
            (selisih > 0 ? '+ ' : selisih < 0 ? '- ' : '') +
            'Rp ' + Math.abs(selisih).toLocaleString('id-ID');

        const card = document.getElementById('selisihCard');

        card.classList.remove('positive', 'negative', 'zero');

        if (selisih > 0) {
            card.classList.add('positive');
        } else if (selisih < 0) {
            card.classList.add('negative');
        } else {
            card.classList.add('zero');
        }
    }

    // Tambahkan variabel global untuk menyimpan data filter
    let currentFilteredData = [];
    let currentPageTable = 1;
    const rowsPerPage = 20;

    function applyCanggih() {
        const dateMin = getPickerDateValue('fDateMin');
        const dateMax = getPickerDateValue('fDateMax');
        const timeMin = getPickerTimeValue('fTimeMin');
        const timeMax = getPickerTimeValue('fTimeMax');
        const fJenisArr = Array.from(document.querySelectorAll('.jenisCheck:checked')).map(cb => cb.value);
        const fKet = document.getElementById('fKet').value.toLowerCase();
        const saldoMin = parseFloat(document.getElementById('fSaldoMin').value) || -Infinity;
        const saldoMax = parseFloat(document.getElementById('fSaldoMax').value) || Infinity;

        const filtered = fullData.filter(r => {
            const rowDate = r[0]; // Format YYYY-MM-DD
            const matchDate = (dateMin ? rowDate >= dateMin : true) && 
                            (dateMax ? rowDate <= dateMax : true);

            // Logika Filter Jam (r[1])
            const rowTime = r[1]; // Format HH:mm
            const matchTime = (timeMin ? rowTime >= timeMin : true) && 
                            (timeMax ? rowTime <= timeMax : true);

            // Logika Filter Jenis & Keterangan
            const matchJenis = fJenisArr.length === 0 || fJenisArr.includes(r[2]);
            const matchKet = fKet ? r[3].toLowerCase().includes(fKet) : true;

            // Logika Filter Saldo (r[6])
            // Karena data dari getDisplayValues berbentuk string "10.000", kita bersihkan dulu
            const rowSaldo = parseFloat(r[6].replace(/\./g, '')) || 0;
            const matchSaldo = (rowSaldo >= saldoMin) && (rowSaldo <= saldoMax);
            return matchDate && matchTime && matchJenis && matchKet && matchSaldo;
            
        });

        currentFilteredData = filtered; // Simpan ke variabel global
        currentPageTable = 1;
        renderCanggih([...filtered].reverse());
        updateSummary(filtered);
        
        // Jika sedang dalam mode CUSTOM, otomatis update grafiknya juga setiap kali filter berubah
        const customBtn = Array.from(document.querySelectorAll('.p-btn')).find(b => b.innerText === 'CUSTOM');
        if (customBtn && customBtn.classList.contains('active')) {
            updateChartPeriod('CUSTOM', customBtn);
        }
    }

    let fullData = [];

    async function loadTableData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px;">Memuat Data...</td></tr>';
        try {
            const res = await fetch(WEB_APP_URL);
            const json = await res.json();
            fullData = json.allData;
            renderCanggih([...fullData].reverse());
            updateSummary(fullData);
            setTimeout(() => {
                updateChartPeriod('1W'); 
            }, 100);
            populateJenisFilter(fullData);
        } catch (e) { tbody.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">Gagal koneksi.</td></tr>'; }
    }

    function toggleFilter() {
        const row = document.getElementById('filterRow');
        row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    }

    function populateJenisFilter(data) {
        const panel = document.getElementById('jenisDropdownPanel');
        const unik = [...new Set(data.map(r => r[2]))];
        const checkboxes = unik.map(j => `
            <label>
                <input type="checkbox" class="jenisCheck" value="${j}" checked onchange="applyCanggih()">
                <span>${j}</span>
            </label>
        `).join('');
        panel.innerHTML = `
            <div class="jenis-bulk-actions">
                <button type="button" onclick="setAllJenis(true)">Pilih Semua</button>
                <button type="button" onclick="setAllJenis(false)">Kosongkan</button>
            </div>
            ${checkboxes}
        `;
    }

    function setAllJenis(checked) {
        document.querySelectorAll('.jenisCheck').forEach(cb => cb.checked = checked);
        applyCanggih();
    }

    function toggleJenisDropdown() {
        document.getElementById('jenisDropdownPanel').classList.toggle('open');
    }

    // biar panel nutup pas klik di luar area dropdown
    document.addEventListener('click', (e) => {
        const panel = document.getElementById('jenisDropdownPanel');
        if (panel && !e.target.closest('th') && panel.classList.contains('open')) {
            panel.classList.remove('open');
        }
    });

    function renderCanggih(data) {

        currentFilteredData = data;

        const start = (currentPageTable - 1) * rowsPerPage;
        const end = start + rowsPerPage;

        const paginatedData = data.slice(start, end);

        document.getElementById('tableBody').innerHTML =
            paginatedData.map(r => {
                let tglTampil = r[0];
                if (tglTampil.includes('-')) {
                    tglTampil = tglTampil.split('-').reverse().join('/');
                }

                // LOGIKA TAMPILAN MODE SELECT
                const rowIdx = r[7]; // Indeks baris asli dari spreadsheet
                const isSelected = selectedRows.includes(rowIdx);
                const trCursor = isSelectMode ? "cursor: pointer;" : "";
                const trBg = isSelected ? "background: var(--out-color); -webkit-tap-highlight-color: transparent;" : "";

                return `
                <tr style="border-bottom: 1px solid var(--bg-items); transition: 0.2s; -webkit-tap-highlight-color: transparent; ${trCursor} ${trBg}" 
                    onclick="${isSelectMode ? `toggleRowSelection(${rowIdx})` : ''}">
                    <td style="padding: 8px;">${tglTampil}</td>
                    <td style="padding: 8px;">${r[1]}</td>
                    <td style="padding: 8px;">${r[2]}</td>
                    <td style="padding: 8px;">${r[3]}</td>
                    <td style="padding: 8px; color:var(--in-color)">${r[4] != "0" ? r[4] : ''}</td>
                    <td style="padding: 8px; color:var(--out-color)">${r[5] != "0" ? r[5] : ''}</td>
                    <td style="padding: 8px; font-weight:bold;">${r[6]}</td>
                </tr>
                `;
            }).join('');

        updatePageInfo();
    }

    function changePage(direction) {

        const totalPages =
            Math.ceil(currentFilteredData.length / rowsPerPage);

        currentPageTable += direction;

        if (currentPageTable < 1)
            currentPageTable = 1;

        if (currentPageTable > totalPages)
            currentPageTable = totalPages;

        renderCanggih(currentFilteredData);
    }

    function updatePageInfo() {

        const totalPages =
            Math.ceil(currentFilteredData.length / rowsPerPage);

        document.getElementById('pageInfo').innerText =
            `Halaman ${currentPageTable} / ${totalPages || 1}`;
    }

    // Interceptor Switch Page agar refresh otomatis
    const oldSwitch = switchPage;
    switchPage = function(i) {
        oldSwitch(i);
        if (i === 1) loadTableData();
};

function showToast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.innerText = msg;

    document.body.appendChild(t);

    setTimeout(() => t.classList.add("show"), 10);

    setTimeout(() => {
        t.classList.remove("show");
        setTimeout(() => t.remove(), 300);
    }, 2000);
}

function toggleSelectMode() {
    isSelectMode = !isSelectMode;
    selectedRows = []; // Reset pilihan setiap masuk/keluar mode
    
    const btnSelect = document.getElementById('btnSelectMode');
    const btnDelete = document.getElementById('btnDeleteSelected');
    
    if (isSelectMode) {
        btnSelect.style.background = "var(--primary-yellow)";
        btnSelect.style.color = "black";
        btnSelect.innerText = "BATALKAN PILIHAN";
        btnDelete.style.display = "inline-block";
    } else {
        btnSelect.style.background = "var(--btn-gray)";
        btnSelect.style.color = "white";
        btnSelect.innerText = "PILIH DATA";
        btnDelete.style.display = "none";
    }
    
    updateDeleteButton();
    renderCanggih(currentFilteredData); // Render ulang tabel untuk memunculkan checkbox
}

function toggleRowSelection(rowIdx) {
    if (!isSelectMode) return;
    
    const index = selectedRows.indexOf(rowIdx);
    if (index > -1) {
        selectedRows.splice(index, 1); // Hapus centang
    } else {
        selectedRows.push(rowIdx); // Tambah centang
    }
    
    updateDeleteButton();
    renderCanggih(currentFilteredData); // Render ulang tabel agar sorotan dan checkbox terupdate
}

function updateDeleteButton() {
    const btnDelete = document.getElementById('btnDeleteSelected');
    btnDelete.innerText = `HAPUS DATA (${selectedRows.length})`;
    btnDelete.disabled = selectedRows.length === 0;
    btnDelete.style.opacity = selectedRows.length === 0 ? "0.5" : "1";
}

// --- CUSTOM ALERT LOGIC ---
function showCustomAlert() {
    if (selectedRows.length === 0) return;
    document.getElementById('alertMessage').innerText = `Yakin ingin menghapus ${selectedRows.length} data yang dipilih?`;
    
    const overlay = document.getElementById('customAlertOverlay');
    const box = document.getElementById('customAlertBox');
    overlay.style.display = 'flex';
    setTimeout(() => {
        overlay.style.opacity = '1';
        box.style.transform = 'scale(1)';
    }, 10);
}

function closeCustomAlert() {
    const overlay = document.getElementById('customAlertOverlay');
    const box = document.getElementById('customAlertBox');
    overlay.style.opacity = '0';
    box.style.transform = 'scale(0.8)';
    setTimeout(() => { overlay.style.display = 'none'; }, 300);
}

async function executeDelete() {
    const btnConfirm = document.getElementById('btnConfirmDelete');
    const originalText = btnConfirm.innerText;
    btnConfirm.innerText = "MENGHAPUS...";
    btnConfirm.disabled = true;

    const formData = new URLSearchParams();
    formData.append('aksi', 'delete');
    formData.append('rows', selectedRows.join(',')); // Kirim baris contoh: "10,12,15"

    try {
        await fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });

        closeCustomAlert();
        showToast("Data berhasil dihapus!");
        
        // Matikan mode select & muat ulang data dari awal
        toggleSelectMode(); 
        loadTableData(); 

        setTimeout(() => {
            updateSaldoHeader();
        }, 500);
        
    } catch (err) {
        showToast("Gagal menghapus data.");
    } finally {
        btnConfirm.innerText = originalText;
        btnConfirm.disabled = false;
    }
}

// ============ CUSTOM DATE & TIME PICKER (generik, dipakai fDateMin/Max & fTimeMin/Max) ============
const BULAN_PICKER = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DOW_PICKER = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const pickerData = {};

function ensurePickerData(key, type){
    if (pickerData[key]) return;
    const now = new Date();
    pickerData[key] = type === 'date'
        ? { confirmedDate: null, tempDate: null, viewMonth: now.getMonth(), viewYear: now.getFullYear() }
        : { confirmedHour: null, confirmedMinute: null, tempHour: now.getHours(), tempMinute: now.getMinutes(), mode: 'hour' };
}

function togglePicker(el, ev){
    ev.stopPropagation();
    const field = el.closest('.picker-field');
    const panel = field.querySelector('.picker-panel');
    const willOpen = !panel.classList.contains('open');
    document.querySelectorAll('.picker-panel').forEach(p => p.classList.remove('open'));
    if (!willOpen) return;
    panel.classList.add('open');

    const key = field.dataset.field, type = field.dataset.type;
    ensurePickerData(key, type);
    const s = pickerData[key];

    if (type === 'date'){
        s.tempDate = s.confirmedDate;
        if (s.confirmedDate){ s.viewMonth = s.confirmedDate.getMonth(); s.viewYear = s.confirmedDate.getFullYear(); }
        renderCalendarFor(field);
    } else {
        s.tempHour = s.confirmedHour ?? new Date().getHours();
        s.tempMinute = s.confirmedMinute ?? new Date().getMinutes();
        s.mode = 'hour';
        renderClockFor(field);
    }
}
document.addEventListener('click', () => document.querySelectorAll('.picker-panel').forEach(p => p.classList.remove('open')));
document.querySelectorAll('.picker-panel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
function cancelPicker(el){ el.closest('.picker-panel').classList.remove('open'); }

// ---------- kalender ----------
function renderCalendarFor(field){
    const s = pickerData[field.dataset.field];
    field.querySelector('.cal-title').innerText = `${BULAN_PICKER[s.viewMonth]} ${s.viewYear}`;
    const grid = field.querySelector('.cal-grid');
    const firstDow = new Date(s.viewYear, s.viewMonth, 1).getDay();
    const totalDays = new Date(s.viewYear, s.viewMonth + 1, 0).getDate();
    const today = new Date();
    let html = DOW_PICKER.map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < firstDow; i++) html += `<div class="cal-day empty"></div>`;
    for (let d = 1; d <= totalDays; d++){
        const isToday = d === today.getDate() && s.viewMonth === today.getMonth() && s.viewYear === today.getFullYear();
        const isSelected = s.tempDate && d === s.tempDate.getDate() && s.viewMonth === s.tempDate.getMonth() && s.viewYear === s.tempDate.getFullYear();
        html += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="pickDay(this, ${d})">${d}</div>`;
    }
    grid.innerHTML = html;
}
function changeMonth(el, dir){
    const field = el.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    const grid = field.querySelector('.cal-grid');
    grid.style.opacity = '0';
    setTimeout(() => {
        s.viewMonth += dir;
        if (s.viewMonth > 11){ s.viewMonth = 0; s.viewYear++; }
        if (s.viewMonth < 0){ s.viewMonth = 11; s.viewYear--; }
        renderCalendarFor(field);
        requestAnimationFrame(() => { grid.style.opacity = '1'; });
    }, 120);
}
function pickDay(el, d){
    const field = el.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    s.tempDate = new Date(s.viewYear, s.viewMonth, d);
    renderCalendarFor(field);
}
function confirmDatePicker(el){
    const field = el.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    s.confirmedDate = s.tempDate;
    if (s.confirmedDate){
        const dd = String(s.confirmedDate.getDate()).padStart(2,'0');
        const mm = String(s.confirmedDate.getMonth() + 1).padStart(2,'0');
        field.querySelector('.picker-label').innerText = `${dd}/${mm}/${s.confirmedDate.getFullYear()}`;
    }
    field.querySelector('.picker-panel').classList.remove('open');
    if (field.dataset.onconfirm) window[field.dataset.onconfirm]?.();
}

// ---------- jam (dial 24 jam, dual ring) ----------
function setTimeMode(el, mode){
    const field = el.closest('.picker-field');
    pickerData[field.dataset.field].mode = mode;
    renderClockFor(field);
}
function renderClockFor(field){
    const s = pickerData[field.dataset.field];
    field.querySelector('.hour-num').innerText = String(s.tempHour).padStart(2,'0');
    field.querySelector('.min-num').innerText = String(s.tempMinute).padStart(2,'0');
    field.querySelector('.hour-num').classList.toggle('active', s.mode === 'hour');
    field.querySelector('.min-num').classList.toggle('active', s.mode === 'minute');
    const face = field.querySelector('.clock-face');
    face.querySelectorAll('.clock-num').forEach(el => el.remove());
    const cx = 95, cy = 95, R_OUTER = 68, R_INNER = 42;
    if (s.mode === 'hour'){
        for (let i = 0; i < 12; i++){
            const rad = (i * 30 - 90) * Math.PI / 180;
            const outerVal = i === 0 ? 12 : i, innerVal = i === 0 ? 0 : i + 12;
            addClockNum(face, cx + R_OUTER*Math.cos(rad), cy + R_OUTER*Math.sin(rad), outerVal, 'outer', outerVal === s.tempHour);
            addClockNum(face, cx + R_INNER*Math.cos(rad), cy + R_INNER*Math.sin(rad), String(innerVal).padStart(2,'0'), 'inner', innerVal === s.tempHour);
        }
    } else {
        for (let i = 0; i < 12; i++){
            const rad = (i * 30 - 90) * Math.PI / 180;
            const val = i * 5;
            addClockNum(face, cx + R_OUTER*Math.cos(rad), cy + R_OUTER*Math.sin(rad), String(val).padStart(2,'0'), 'outer', val === s.tempMinute);
        }
    }
    updateHandFor(field);
}
function addClockNum(face, x, y, label, ringClass, isSelected){
    const num = document.createElement('div');
    num.className = `clock-num ${ringClass}` + (isSelected ? ' selected' : '');
    num.style.left = x + 'px'; num.style.top = y + 'px';
    num.innerText = label;
    num.onclick = (e) => { e.stopPropagation(); selectClockValue(face, typeof label === 'number' ? label : parseInt(label, 10)); };
    face.appendChild(num);
}
function updateHandFor(field){
    const s = pickerData[field.dataset.field];
    const hand = field.querySelector('.clock-hand');
    let angleDeg, len;
    if (s.mode === 'hour'){
        const isInner = s.tempHour === 0 || s.tempHour >= 13;
        angleDeg = (s.tempHour % 12) * 30;
        len = isInner ? 42 : 68;
    } else { angleDeg = s.tempMinute * 6; len = 68; }
    hand.style.height = len + 'px';
    hand.style.transform = `rotate(${angleDeg}deg)`;
}
function selectClockValue(face, value){
    const field = face.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    if (s.mode === 'hour'){
        s.tempHour = value;
        renderClockFor(field);
        setTimeout(() => setTimeMode(field.querySelector('.hour-num'), 'minute'), 180);
    } else { s.tempMinute = value; renderClockFor(field); }
}
function clockClick(face, e){
    e.stopPropagation();
    const field = face.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    const rect = face.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width/2, y = e.clientY - rect.top - rect.height/2;
    const dist = Math.sqrt(x*x + y*y);
    let angle = (Math.atan2(y, x) * 180/Math.PI + 90 + 360) % 360;
    if (s.mode === 'hour'){
        let idx = Math.round(angle/30) % 12;
        const value = dist >= 55 ? (idx === 0 ? 12 : idx) : (idx === 0 ? 0 : idx + 12);
        selectClockValue(face, value);
    } else {
        s.tempMinute = Math.round(angle/6) % 60;
        renderClockFor(field);
    }
}
function confirmTimePicker(el){
    const field = el.closest('.picker-field');
    const s = pickerData[field.dataset.field];
    s.confirmedHour = s.tempHour; s.confirmedMinute = s.tempMinute;
    field.querySelector('.picker-label').innerText = `${String(s.confirmedHour).padStart(2,'0')}:${String(s.confirmedMinute).padStart(2,'0')}`;
    field.querySelector('.picker-panel').classList.remove('open');
    if (field.dataset.onconfirm) window[field.dataset.onconfirm]?.();
}

// ---------- value final buat applyCanggih() ----------
function getPickerDateValue(key){
    const d = pickerData[key]?.confirmedDate;
    if (!d) return '';
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getPickerTimeValue(key){
    const s = pickerData[key];
    if (!s || s.confirmedHour == null) return '';
    return `${String(s.confirmedHour).padStart(2,'0')}:${String(s.confirmedMinute).padStart(2,'0')}`;
}

function clearPicker(el){
    const field = el.closest('.picker-field');
    const key = field.dataset.field;
    const type = field.dataset.type;
    const placeholder = field.dataset.placeholder || (type === 'date' ? 'dd/mm/yyyy' : '--:--');

    if (pickerData[key]){
        if (type === 'date'){ pickerData[key].confirmedDate = null; pickerData[key].tempDate = null; }
        else { pickerData[key].confirmedHour = null; pickerData[key].confirmedMinute = null; }
    }
    field.querySelector('.picker-label').innerText = placeholder;
    field.querySelector('.picker-panel').classList.remove('open');
    if (field.dataset.onconfirm) window[field.dataset.onconfirm]?.();
}
